<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURAX MONTAÑISMO GT | Más que caminar, vivir la montaña</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #5CE1E6;
            --primary-dark: #00B4B0;
            --bg-dark: #0A0A0A;
            --bg-card: #121212;
            --bg-card-hover: #1E1E1E;
            --text-light: #FFFFFF;
            --text-gray: #8A8A8A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'League Spartan', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header & Navigation */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(92, 225, 230, 0.2);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-container img {
            height: 45px;
            object-fit: contain;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--primary);
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 60px;
            background: linear-gradient(180deg, rgba(10,10,10,0.7) 0%, rgba(10,10,10,1) 100%),
                        radial-gradient(circle at center, rgba(92, 225, 230, 0.15) 0%, transparent 70%);
        }

        .hero-content {
            max-width: 900px;
            z-index: 2;
        }

        .hero-images {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .hero-images img {
            max-height: 140px;
            filter: drop-shadow(0 0 15px rgba(92, 225, 230, 0.4));
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: var(--text-light);
            text-shadow: 0 0 20px rgba(92, 225, 230, 0.3);
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero-subtitle {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .hero-slogan {
            font-size: 1.4rem;
            font-style: italic;
            color: var(--text-gray);
            margin-bottom: 35px;
        }

        /* Primary CTA Button */
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: #25D366;
            color: #FFFFFF;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 16px 35px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 35px rgba(37, 211, 102, 0.7);
            background-color: #20ba5a;
        }

            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
